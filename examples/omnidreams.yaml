# The ego's front camera generated by OmniDreams (cosmos_canvas.omnidreams), through carla_canvas.
# The renderer runs in FlashDreams' environment (its container image, with carla-canvas and roadgen
# on the path), started by `command` or by hand (`carla-canvas serve --config ...`).
renderer:
  backend: cosmos_canvas.omnidreams:OmniDreamsRenderer
  endpoint: "localhost:50553"
  startup_timeout: 900   # LoadWorld: the model loads
  timeout: 120           # a tick that generates a chunk
  options:
    config: omnidreams                          # FlashDreams' OmniDreams configuration (NVIDIA's public checkpoint)
    # checkpoint: /path/to/weights.pt           # a fine-tune's weights, written to checkpoint_env for its configuration
    # checkpoint_env: SOME_CKPT_VARIABLE
    fps: 30                                     # the checkpoint's frame rate
    raster: ludus                               # the raster it was trained on: ludus, or package.module:Class
    camera: /path/to/camera_front_wide_120fov.json    # the generated camera (rig.py; scripts/ftheta_camera.py)
    first_image: /path/to/first_frame.png       # the scene's first frame, the generated size (first_image.py)
    caption: "A forward-facing dashcam view of an urban drive in clear daytime, on a dry road."
    map_extras: /path/to/Town10HD_Opt.extras.json     # optional: scripts/export_map_extras.py
    steps: 2
    seed: 0
    reproject: true      # false: the CARLA camera stands in for the generated one (its centred band, resized)
sensors:
  - {type: sensor.camera.rgb, role_name: front}
